name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'docker/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  # ---------------------------------------------------------------------------
  # Lint — PHP CS Fixer / Pint
  # ---------------------------------------------------------------------------
  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Run Pint (dry run)
        working-directory: backend
        run: ./vendor/bin/pint --test

  # ---------------------------------------------------------------------------
  # Security Audit
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Run security audit
        working-directory: backend
        run: composer audit

  # ---------------------------------------------------------------------------
  # Tests — Feature + Unit with PostgreSQL
  # ---------------------------------------------------------------------------
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: slms_test
          POSTGRES_USER: slms
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, gd, zip, intl, bcmath, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env for testing
        working-directory: backend
        run: cp .env.testing.example .env.testing

      - name: Generate key
        working-directory: backend
        run: php artisan key:generate --env=testing

      - name: Run migrations (test DB)
        working-directory: backend
        run: php artisan migrate --env=testing --force

      - name: Run tests
        working-directory: backend
        run: php artisan test --parallel --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: slms_test
          DB_USERNAME: slms
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.php == '8.3'
        with:
          files: backend/coverage.xml
          flags: backend
