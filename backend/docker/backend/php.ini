; =============================================================================
; SLMS PHP Configuration
; Tuned for Laravel 12 on production-parity development
; =============================================================================

[PHP]
; --- Error Handling ---
; In dev, display errors. In prod, override via environment.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php-error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Performance ---
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- File Uploads (for media/asset uploads) ---
file_uploads = On
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 20

; --- Sessions ---
session.gc_maxlifetime = 3600
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict

; --- OPcache (critical for production performance) ---
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
; Set to 0 in production for max perf; keep 1 in dev for file change detection
opcache.validate_timestamps = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
