; =============================================================================
; SLMS PHP-FPM Pool Configuration
; =============================================================================
[www]
user = slms
group = slms

; Listen on socket for better performance with Nginx in same network
listen = 0.0.0.0:9000

; --- Process Management ---
; dynamic: scales between pm.min_spare_servers and pm.max_children
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; --- Logging ---
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; --- Timeouts ---
request_terminate_timeout = 120s

; --- Environment passthrough ---
; Allows .env values to reach PHP-FPM workers
clear_env = no
