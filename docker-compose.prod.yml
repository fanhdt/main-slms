# =============================================================================
# SLMS - Docker Compose (Production)
# =============================================================================

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: slms_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d.prod/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/public/storage:ro
    depends_on:
      - backend
      - frontend
    networks:
      - slms_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    container_name: slms_backend
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: "${MINIO_BUCKET:-slms}"
      AWS_ENDPOINT: "http://minio:9000"
      AWS_ENDPOINT_PUBLIC: "${AWS_ENDPOINT_PUBLIC}"
      AWS_URL: "${AWS_URL}"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"

      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST}"
      MAIL_PORT: "${MAIL_PORT}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SLMS}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - slms_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    container_name: slms_worker
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: "${MINIO_BUCKET:-slms}"
      AWS_ENDPOINT: "http://minio:9000"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    depends_on:
      - backend
      - redis
    networks:
      - slms_network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    container_name: slms_scheduler
    command: php artisan schedule:work
    volumes:
      - backend_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
    depends_on:
      - backend
      - redis
    networks:
      - slms_network
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: runtime
    container_name: slms_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"
      FRONTEND_URL: "${FRONTEND_URL}"
      REDIS_HOST: redis
    depends_on:
      - backend
      - redis
    networks:
      - slms_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL}"
        VITE_REVERB_APP_KEY: "${VITE_REVERB_APP_KEY}"
        VITE_REVERB_HOST: "${VITE_REVERB_HOST}"
        VITE_REVERB_PORT: "${VITE_REVERB_PORT}"
        VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME}"
    container_name: slms_frontend
    networks:
      - slms_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: slms_postgres
    environment:
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slms_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: slms_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slms_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: slms_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - slms_network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: slms_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set slms http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing slms/${MINIO_BUCKET:-slms};
        mc anonymous set download slms/${MINIO_BUCKET:-slms}/public;
        echo 'MinIO buckets ready.';
      "
    networks:
      - slms_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_storage:

networks:
  slms_network:
    driver: bridge
    name: slms_network
