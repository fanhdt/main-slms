# =============================================================================
# Redis Configuration — SLMS
# =============================================================================

# Security: no external bind in development (Docker network isolates it)
bind 0.0.0.0
protected-mode no

# Persistence — AOF for durability in dev (queued jobs survive restarts)
appendonly yes
appendfsync everysec

# Memory policy — when maxmemory is reached, evict least-recently-used keys
# 'allkeys-lru' means ALL keys are eligible, not just those with TTL.
# Good for cache + session combined usage.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable dangerous commands in production; left for dev convenience
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""

# Logging
loglevel notice

# Slow query log (queries > 10ms)
slowlog-log-slower-than 10000
slowlog-max-len 128
